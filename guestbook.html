<div class="crt">
  <div class="screen">
    <div class="titlebar">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <span class="path">root@sentinel : ~/guestbook</span>

    <nav class="tabnav">

    <div class="page">
      <article>
        <h1>guestbook</h1>
        <p class="subtitle">leave a note. keep it clean, i mean it.</p>

        <h2>sign it</h2>
        <div class="gb-form" aria-label="guestbook entry form">
          <div class="gb-field">
            <label for="gbName">name</label>
            <input type="text" id="gbName" maxlength="40" autocomplete="off" spellcheck="false" placeholder="whoever you are">
            <span class="gb-counter" id="gbNameCount">0/40</span>
          </div>
          <div class="gb-field">
            <label for="gbMessage">message</label>
            <textarea id="gbMessage" maxlength="200" rows="3" spellcheck="false" placeholder="say something"></textarea>
            <span class="gb-counter" id="gbMessageCount">0/200</span>
          </div>
          <button type="button" id="gbSubmit" class="gb-btn">sign guestbook</button>
          <p class="gb-status" id="gbStatus" role="status" aria-live="polite"></p>
        </div>

        <h2>entries</h2>
        <div id="gbEntries" class="gb-entries" aria-live="polite">
          <p class="dim">loading guestbook...</p>
        </div>
      </article>

      <a class="back" href="index.html">&larr; back to ~/</a>
    </div>
  </div>
